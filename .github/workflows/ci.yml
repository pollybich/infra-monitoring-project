name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bash scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test successful API response
        run: ./check_api.sh https://httpbin.org/status/200