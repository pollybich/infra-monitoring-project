name: infra-monitoring-project

services:
  api:
    image: hashicorp/http-echo:1.0.0
    command:
      - "-listen=:8080"
      - "-text=Monitoring Service Active"
    expose:
      - "8080"
    networks:
      - monitoring-network
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  monitoring-network:
    driver: bridge